Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("oc_meadow")
oc_meadow = forBiomes("biometweaker:oc_meadow")
oc_meadow.set("name", "Oceanian Meadow")
oc_meadow.inheritProperties("biomesoplenty:meadow", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
oc_meadow.set("height", 3.7)
oc_meadow.set("genVillages", true)
oc_meadow.addDicTypes("FOREST")
oc_meadow.addDicTypes("COLD")
oc_meadow.addDicTypes("LUSH")
oc_meadow.addDicTypes("SPARSE")
oc_meadow.addDicTypes("WET")













































