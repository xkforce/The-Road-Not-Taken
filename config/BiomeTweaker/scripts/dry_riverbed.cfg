Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("dry_riverbed")
dry_riverbed = forBiomes("biometweaker:dry_riverbed", "minecraft:river")
dry_riverbed.set("name", "Dry Riverbed")
dry_riverbed.inheritProperties("minecraft:desert", "grassColor", "foliageColor", "waterColor")
dry_riverbed.set("height", 3.2)
dry_riverbed.set("heightVariation", 0.0)
dry_riverbed.set("temperature", 1.0)
dry_riverbed.set("humidity", 0.0)
dry_riverbed.set("genVillages", false)
dry_riverbed.addDicTypes("DRY")
dry_riverbed.removeDicTypes("WATER")

Tweaker.setPlacementStage("PRE_POPULATE")
air = forBlock("minecraft:air")
blockRepwater = newBlockReplacement()
blockRepwater.set("block", air)
blockRepwater.set("minY", 115)
blockRepwater.set("maxY", 128)

dry_riverbed.registerGenBlockRep("minecraft:water", blockRepwater)
