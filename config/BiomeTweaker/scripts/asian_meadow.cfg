Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("as_meadow")
as_meadow = forBiomes("biometweaker:as_meadow")
as_meadow.set("name", "Asian Meadow")
as_meadow.inheritProperties("biomesoplenty:meadow", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
as_meadow.set("height", 3.7)
as_meadow.set("genVillages", true)
as_meadow.addDicTypes("FOREST")
as_meadow.addDicTypes("COLD")
as_meadow.addDicTypes("LUSH")
as_meadow.addDicTypes("SPARSE")
as_meadow.addDicTypes("WET")













































