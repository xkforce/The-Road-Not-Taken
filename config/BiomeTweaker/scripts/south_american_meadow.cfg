Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("sa_meadow")
sa_meadow = forBiomes("biometweaker:sa_meadow")
sa_meadow.set("name", "South American Meadow")
sa_meadow.inheritProperties("biomesoplenty:meadow", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
sa_meadow.set("height", 3.7)
sa_meadow.set("genVillages", true)
sa_meadow.addDicTypes("FOREST")
sa_meadow.addDicTypes("COLD")
sa_meadow.addDicTypes("LUSH")
sa_meadow.addDicTypes("SPARSE")
sa_meadow.addDicTypes("WET")













































