Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("saf_meadow")
saf_meadow = forBiomes("biometweaker:saf_meadow")
saf_meadow.set("name", "South African Meadow")
saf_meadow.inheritProperties("biomesoplenty:meadow", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
saf_meadow.set("height", 3.7)
saf_meadow.set("genVillages", true)
saf_meadow.addDicTypes("FOREST")
saf_meadow.addDicTypes("COLD")
saf_meadow.addDicTypes("LUSH")
saf_meadow.addDicTypes("SPARSE")
saf_meadow.addDicTypes("WET")













































