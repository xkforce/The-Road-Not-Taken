Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("as_jungle")
as_jungle = forBiomes("biometweaker:as_jungle")
as_jungle.set("name", "Asian Jungle")
as_jungle.inheritProperties("biomesoplenty:meadow", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
as_jungle.set("height", 3.7)
as_jungle.set("genVillages", true)
as_jungle.addDicTypes("FOREST")
as_jungle.addDicTypes("COLD")
as_jungle.addDicTypes("LUSH")
as_jungle.addDicTypes("SPARSE")
as_jungle.addDicTypes("WET")
