Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("as_river")
as_river = forBiomes("biometweaker:as_river", "minecraft:river")
as_river.set("name", "Asian River")
as_river.inheritProperties("minecraft:jungle", "humidity", "temperature", "grassColor", "foliageColor", "waterColor")
as_river.set("height", 3.2)
as_river.set("genVillages", false)
