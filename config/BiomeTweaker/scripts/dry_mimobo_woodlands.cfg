Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("dry_miombo_woodlands", "minecraft:extreme_hills_with_trees")
dry_miombo_woodlands = forBiomes("biometweaker:dry_miombo_woodlands")
dry_miombo_woodlands.set("name", "Dry Mimobo Woodlands")
dry_miombo_woodlands.inheritProperties("minecraft:savanna", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
dry_miombo_woodlands.set("height", 3.88)
dry_miombo_woodlands.set("genVillages", true)
dry_miombo_woodlands.addDicTypes("SAVANNA")
dry_miombo_woodlands.addDicTypes("HOT")
dry_miombo_woodlands.removeDicTypes("MOUNTAIN")





