Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("naf_meadow")
naf_meadow = forBiomes("biometweaker:naf_meadow")
naf_meadow.set("name", "North African Meadow")
naf_meadow.inheritProperties("biomesoplenty:meadow", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
naf_meadow.set("height", 3.7)
naf_meadow.set("genVillages", true)
naf_meadow.addDicTypes("FOREST")
naf_meadow.addDicTypes("COLD")
naf_meadow.addDicTypes("LUSH")
naf_meadow.addDicTypes("SPARSE")
naf_meadow.addDicTypes("WET")













































