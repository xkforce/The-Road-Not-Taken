Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("dunelagoon", "biomesoplenty:highland")
dunelagoon = forBiomes("biometweaker:dunelagoon")
dunelagoon.set("name", "Sand Dunes")
dunelagoon.set("averageheight", 127.0)
dunelagoon.set("variationbelow", 20.0)
dunelagoon.set("variationabove", 20.0)
dunelagoon.set("temperature", 2.0)
dunelagoon.set("humidity", 0.0)
dunelagoon.set("topBlock", "minecraft:stone")
dunelagoon.set("fillerBlock", "minecraft:stone")
dunelagoon.set("grassColor", -4212907)
dunelagoon.set("foliageColor", -5331926)
dunelagoon.set("waterColor", 4159204)
dunelagoon.removeDecoration("LAKE_WATER")
dunelagoon.removeFeature("LAKE")
dunelagoon.removeAllSpawns("WATER_CREATURE")
dunelagoon.removeAllSpawns("CREATURE")
dunelagoon.removeDecoration("TREE")
dunelagoon.addDicTypes("HILLS")
dunelagoon.addDicTypes("DRY")
dunelagoon.addDicTypes("HOT")
dunelagoon.addDicTypes("SANDY")

Tweaker.setPlacementStage("BIOME_BLOCKS")

sand = forBlock("minecraft:sand")
sandstone = forBlock("minecraft:sandstone")

blockRepsand = newBlockReplacement()
blockRepsand.set("block", sand)
blockRepsand.set("minY", 114)
blockRepsand.set("maxY", 160)

blockRepsandstone = newBlockReplacement()
blockRepsandstone.set("block", sandstone)
blockRepsandstone.set("minY", 112)
blockRepsandstone.set("maxY", 115)

dunelagoon.registerGenBlockRep("minecraft:stone", blockRepsand)
dunelagoon.registerGenBlockRep("minecraft:stone", blockRepsandstone)

































