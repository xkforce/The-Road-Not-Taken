Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("sa_river")
sa_river = forBiomes("biometweaker:sa_river", "minecraft:river")
sa_river.set("name", "South American River")
sa_river.inheritProperties("minecraft:jungle", "humidity", "temperature", "grassColor", "foliageColor", "waterColor")
sa_river.set("height", 3.2)
sa_river.set("genVillages", false)
sa_river.addDicTypes("JUNGLE")
sa_river.addDicTypes("HOT")
