craterlakeisland.set("heightVariation", 0.025)
craterlakeisland.set("temperature", 0.8)
craterlakeisland.set("topBlock", "bblsom:blackpodzol")
craterlakeisland.set("fillerBlock", "bblsom:blackdirt")
craterlakeisland.removeDicTypes("COLD")
craterlakeisland.addDicTypes("ISLAND")
































