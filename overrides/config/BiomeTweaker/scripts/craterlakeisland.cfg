Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("craterlakeisland", "minecraft:taiga")
craterlakeisland = forBiomes("biometweaker:craterlakeisland")
craterlakeisland.set("name", "Crater Lake Island")
