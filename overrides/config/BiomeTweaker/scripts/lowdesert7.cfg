Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("lowdesert7", "minecraft:desert")
lowdesert7 = forBiomes("biometweaker:lowdesert7")
lowdesert7.set("name", "Low Desert 7")
lowdesert7.set("height", 2.5)
lowdesert7.set("heightVariation", 0.025)
lowdesert7.set("topBlock", "minecraft:sand")
lowdesert7.set("fillerBlock", "minecraft:sand")
lowdesert7.set("oceanTopBlock", "minecraft:sand")
lowdesert7.set("oceanFillerBlock", "minecraft:sand")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

lowdesert7.registerGenBlockRep("minecraft:water", blockRepwaterair)










































