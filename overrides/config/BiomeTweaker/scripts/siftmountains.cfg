Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("siftmountains", "minecraft:plains")
siftmountains = forBiomes("biometweaker:siftmountains")
siftmountains.set("name", "Sift Mountains")
siftmountains.set("averageheight", 172.0)
siftmountains.set("variationbelow", 30.0)
siftmountains.set("variationabove", 60.0)
siftmountains.set("topBlock", "contenttweaker:siftstone")
siftmountains.set("fillerBlock", "contenttweaker:siftstone")
siftmountains.addActualFillerBlock("contenttweaker:siftstone")











































