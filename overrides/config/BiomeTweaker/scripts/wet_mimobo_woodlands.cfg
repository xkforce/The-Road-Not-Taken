Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("wet_miombo_woodlands", "minecraft:extreme_hills_with_trees")
wet_miombo_woodlands = forBiomes("biometweaker:wet_miombo_woodlands")
wet_miombo_woodlands.set("name", "Wet Mimobo Woodlands")
wet_miombo_woodlands.inheritProperties("minecraft:jungle", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
wet_miombo_woodlands.set("height", 3.88)
wet_miombo_woodlands.set("genVillages", true)
wet_miombo_woodlands.addDicTypes("SAVANNA")
wet_miombo_woodlands.addDicTypes("HOT")
wet_miombo_woodlands.removeDicTypes("MOUNTAIN")





