Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("lowdesert8", "minecraft:desert")
lowdesert8 = forBiomes("biometweaker:lowdesert8")
lowdesert8.set("name", "Low Desert 8")
lowdesert8.set("height", 3.0)
lowdesert8.set("heightVariation", 0.025)
lowdesert8.set("topBlock", "minecraft:sand")
lowdesert8.set("fillerBlock", "minecraft:sand")
lowdesert8.set("oceanTopBlock", "minecraft:sand")
lowdesert8.set("oceanFillerBlock", "minecraft:sand")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

lowdesert8.registerGenBlockRep("minecraft:water", blockRepwaterair)










































