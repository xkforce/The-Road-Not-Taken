Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("lowdesert2", "minecraft:desert")
lowdesert2 = forBiomes("biometweaker:lowdesert2")
lowdesert2.set("name", "Low Desert 2")
lowdesert2.set("height", 0.0)
lowdesert2.set("heightVariation", 0.025)
lowdesert2.set("topBlock", "minecraft:sand")
lowdesert2.set("fillerBlock", "minecraft:sand")
lowdesert2.set("oceanTopBlock", "minecraft:sand")
lowdesert2.set("oceanFillerBlock", "minecraft:sand")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

lowdesert2.registerGenBlockRep("minecraft:water", blockRepwaterair)










































