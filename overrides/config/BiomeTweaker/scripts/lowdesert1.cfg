Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("lowdesert1", "minecraft:desert")
lowdesert1 = forBiomes("biometweaker:lowdesert1")
lowdesert1.set("name", "Low Desert 1")
lowdesert1.set("height", -0.5)
lowdesert1.set("heightVariation", 0.025)
lowdesert1.set("topBlock", "minecraft:sand")
lowdesert1.set("fillerBlock", "minecraft:sand")
lowdesert1.set("oceanTopBlock", "minecraft:sand")
lowdesert1.set("oceanFillerBlock", "minecraft:sand")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

lowdesert1.registerGenBlockRep("minecraft:water", blockRepwaterair)










































