Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("lowdesert5", "minecraft:desert")
lowdesert5 = forBiomes("biometweaker:lowdesert5")
lowdesert5.set("name", "Low Desert 5")
lowdesert5.set("height", 1.5)
lowdesert5.set("heightVariation", 0.025)
lowdesert5.set("topBlock", "minecraft:sand")
lowdesert5.set("fillerBlock", "minecraft:sand")
lowdesert5.set("oceanTopBlock", "minecraft:sand")
lowdesert5.set("oceanFillerBlock", "minecraft:sand")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

lowdesert5.registerGenBlockRep("minecraft:water", blockRepwaterair)










































