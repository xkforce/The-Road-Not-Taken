Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("lowdesert3", "minecraft:desert")
lowdesert3 = forBiomes("biometweaker:lowdesert3")
lowdesert3.set("name", "Low Desert 3")
lowdesert3.set("height", 0.5)
lowdesert3.set("heightVariation", 0.025)
lowdesert3.set("topBlock", "minecraft:sand")
lowdesert3.set("fillerBlock", "minecraft:sand")
lowdesert3.set("oceanTopBlock", "minecraft:sand")
lowdesert3.set("oceanFillerBlock", "minecraft:sand")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

lowdesert3.registerGenBlockRep("minecraft:water", blockRepwaterair)










































