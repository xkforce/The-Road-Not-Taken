Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("sa_jungle")
sa_jungle = forBiomes("biometweaker:sa_jungle")
sa_jungle.set("name", "South American Jungle")
sa_jungle.inheritProperties("biomesoplenty:meadow", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
sa_jungle.set("height", 3.7)
sa_jungle.set("genVillages", true)
sa_jungle.addDicTypes("FOREST")
sa_jungle.addDicTypes("COLD")
sa_jungle.addDicTypes("LUSH")
sa_jungle.addDicTypes("SPARSE")
sa_jungle.addDicTypes("WET")
