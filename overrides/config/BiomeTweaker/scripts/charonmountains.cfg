Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("charonmountains")
charonmountains = forBiomes("biometweaker:charonmountains", "biomesoplenty:mountain")
charonmountains.set("name", "Vesta Mountains")
charonmountains.set("temperature", 0.5)
charonmountains.set("humidity", 0.0)
charonmountains.set("enableRain", false)
charonmountains.set("enableSnow", false)
charonmountains.set("genVillages", false)
charonmountains.set("topBlock", "bblsom:redasteroiddirt")
charonmountains.set("fillerBlock", "contenttweaker:pigeonite")
charonmountains.removeDecoration("TREE")
charonmountains.removeDecoration("FLOWERS")
charonmountains.removeDecoration("LAKE_WATER")
charonmountains.removeDecoration("LAKE_LAVA")
charonmountains.removeFeature("LAKE")
charonmountains.removeFeature("LAVA")
charonmountains.addDicTypes("SPACE")
charonmountains.addDicTypes("COLD")
charonmountains.addDicTypes("DRY")
charonmountains.removeGeneratorBOP("miners_delight")
charonmountains.removeAllSpawns("AMBIENT")
charonmountains.removeAllSpawns("CREATURE")
charonmountains.removeAllSpawns("MONSTER")
charonmountains.removeAllSpawns("WATER_CREATURE")




































