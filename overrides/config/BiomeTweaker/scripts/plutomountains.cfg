plutomountains.removeDecoration("FLOWERS")
plutomountains.removeDecoration("LAKE_WATER")
plutomountains.removeDecoration("LAKE_LAVA")
plutomountains.removeFeature("LAKE")
plutomountains.removeFeature("LAVA")
plutomountains.addDicTypes("SPACE")
