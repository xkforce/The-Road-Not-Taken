Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("plutoplains")
plutoplains = forBiomes("biometweaker:plutoplains")
plutoplains.set("name", "V Type Asteroid")
plutoplains.set("height", 3.88)
plutoplains.set("heightVariation", 0.05)
plutoplains.set("temperature", 0.5)
plutoplains.set("humidity", 0.0)
plutoplains.set("enableRain", false)
plutoplains.set("enableSnow", false)
plutoplains.set("genVillages", false)
plutoplains.set("topBlock", "bblsom:redasteroiddirt")
plutoplains.set("fillerBlock", "contenttweaker:pigeonite")
plutoplains.removeDecoration("TREE")
plutoplains.removeDecoration("FLOWERS")
plutoplains.removeDecoration("LAKE_WATER")
plutoplains.removeDecoration("LAKE_LAVA")
plutoplains.removeFeature("LAKE")
plutoplains.removeFeature("LAVA")
plutoplains.addDicTypes("SPACE")
plutoplains.addDicTypes("COLD")
plutoplains.addDicTypes("DRY")
plutoplains.removeGeneratorBOP("miners_delight")
plutoplains.removeAllSpawns("AMBIENT")
plutoplains.removeAllSpawns("CREATURE")
plutoplains.removeAllSpawns("MONSTER")
plutoplains.removeAllSpawns("WATER_CREATURE")




































