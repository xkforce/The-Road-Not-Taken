Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("saltflats", "biomesoplenty:highland")
saltflats = forBiomes("biometweaker:saltflats")
saltflats.set("name", "Salt Flats")
saltflats.set("averageheight", 120.0)
saltflats.set("variationbelow", 0.0)
saltflats.set("variationabove", 0.0)
saltflats.set("topBlock", "contenttweaker:saltblock")
saltflats.set("fillerBlock", "contenttweaker:saltblock")
saltflats.set("oceanTopBlock", "contenttweaker:saltblock")
saltflats.set("oceanFillerBlock", "contenttweaker:saltblock")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

saltflats.registerGenBlockRep("minecraft:water", blockRepwaterair)











































