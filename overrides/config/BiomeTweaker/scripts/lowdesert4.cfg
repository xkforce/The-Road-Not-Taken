Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("lowdesert4", "minecraft:desert")
lowdesert4 = forBiomes("biometweaker:lowdesert4")
lowdesert4.set("name", "Low Desert 4")
lowdesert4.set("height", 1.0)
lowdesert4.set("heightVariation", 0.025)
lowdesert4.set("topBlock", "minecraft:sand")
lowdesert4.set("fillerBlock", "minecraft:sand")
lowdesert4.set("oceanTopBlock", "minecraft:sand")
lowdesert4.set("oceanFillerBlock", "minecraft:sand")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

lowdesert4.registerGenBlockRep("minecraft:water", blockRepwaterair)










































