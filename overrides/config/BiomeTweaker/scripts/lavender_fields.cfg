Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("lavender_fields")
lavenderfields = forBiomes("biometweaker:lavender_fields")
lavenderfields.set("name", "Lavender Fields")
lavenderfields.set("height", 3.7)
lavenderfields.set("heightVariation", 0.025)
lavenderfields.set("temperature", 0.7)
lavenderfields.set("humidity", 0.7)
lavenderfields.addDicTypes("LUSH")
lavenderfields.addDicTypes("MAGICAL")
lavenderfields.set("grassColor", 10601325)
lavenderfields.set("foliageColor", 10601325)
lavenderfields.set("waterColor", 4159204)
lavenderfields.removeDecoration("PUMPKIN")
lavenderfields.set("treesPerChunk", 1)







































