Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("na_meadow")
na_meadow = forBiomes("biometweaker:na_meadow")
na_meadow.set("name", "North American Meadow")
na_meadow.inheritProperties("biomesoplenty:meadow", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
na_meadow.set("height", 3.7)
na_meadow.set("genVillages", true)
na_meadow.addDicTypes("FOREST")
na_meadow.addDicTypes("COLD")
na_meadow.addDicTypes("LUSH")
na_meadow.addDicTypes("SPARSE")
na_meadow.addDicTypes("WET")













































