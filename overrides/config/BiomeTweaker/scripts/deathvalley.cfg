Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("deathvalley", "minecraft:desert")
deathvalley = forBiomes("biometweaker:deathvalley")
deathvalley.set("name", "Death Valley")
deathvalley.set("height", -1.0)
deathvalley.set("heightVariation", 0.025)
deathvalley.set("topBlock", "minecraft:sand")
deathvalley.set("fillerBlock", "minecraft:sand")
deathvalley.set("oceanTopBlock", "minecraft:sand")
deathvalley.set("oceanFillerBlock", "minecraft:sand")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

deathvalley.registerGenBlockRep("minecraft:water", blockRepwaterair)










































