Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("caf_jungle")
caf_jungle = forBiomes("biometweaker:caf_jungle")
caf_jungle.set("name", "Central African Jungle")
caf_jungle.inheritProperties("biomesoplenty:meadow", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
caf_jungle.set("height", 3.7)
caf_jungle.set("genVillages", true)
caf_jungle.addDicTypes("FOREST")
caf_jungle.addDicTypes("COLD")
caf_jungle.addDicTypes("LUSH")
caf_jungle.addDicTypes("SPARSE")
caf_jungle.addDicTypes("WET")
