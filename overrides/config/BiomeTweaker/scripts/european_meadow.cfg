Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("eu_meadow")
eu_meadow = forBiomes("biometweaker:eu_meadow")
eu_meadow.set("name", "European Meadow")
eu_meadow.inheritProperties("biomesoplenty:meadow", "heightVariation", "temperature", "humidity", "grassColor", "foliageColor", "waterColor")
eu_meadow.set("height", 3.7)
eu_meadow.set("genVillages", true)
eu_meadow.addDicTypes("FOREST")
eu_meadow.addDicTypes("COLD")
eu_meadow.addDicTypes("LUSH")
eu_meadow.addDicTypes("SPARSE")
eu_meadow.addDicTypes("WET")













































