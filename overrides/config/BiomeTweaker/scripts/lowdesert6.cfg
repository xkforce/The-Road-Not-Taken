Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("lowdesert6", "minecraft:desert")
lowdesert6 = forBiomes("biometweaker:lowdesert6")
lowdesert6.set("name", "Low Desert 6")
lowdesert6.set("height", 2.0)
lowdesert6.set("heightVariation", 0.025)
lowdesert6.set("topBlock", "minecraft:sand")
lowdesert6.set("fillerBlock", "minecraft:sand")
lowdesert6.set("oceanTopBlock", "minecraft:sand")
lowdesert6.set("oceanFillerBlock", "minecraft:sand")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

lowdesert6.registerGenBlockRep("minecraft:water", blockRepwaterair)










































