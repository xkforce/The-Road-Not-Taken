Tweaker.setScriptStage("BIOME_REGISTRY")

Tweaker.createBiome("lowdesert9", "minecraft:desert")
lowdesert9 = forBiomes("biometweaker:lowdesert9")
lowdesert9.set("name", "Low Desert 9")
lowdesert9.set("height", 3.8)
lowdesert9.set("heightVariation", 0.025)
lowdesert9.set("topBlock", "minecraft:sand")
lowdesert9.set("fillerBlock", "minecraft:sand")
lowdesert9.set("oceanTopBlock", "minecraft:sand")
lowdesert9.set("oceanFillerBlock", "minecraft:sand")

Tweaker.setPlacementStage("BIOME_BLOCKS")

air = forBlock("minecraft:air")
blockRepwaterair = newBlockReplacement()
blockRepwaterair.set("block", air)
blockRepwaterair.set("minY", 40)
blockRepwaterair.set("maxY", 128)

lowdesert9.registerGenBlockRep("minecraft:water", blockRepwaterair)










































